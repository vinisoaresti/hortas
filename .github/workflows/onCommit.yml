name: Workflow para commits

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up do Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Criar ambiente virtual e instalar dependências
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --only-binary=:all: -r requirements.txt

      - name: Salvar ambiente virtual como artefato
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: python-env
          path: .venv/
          include-hidden-files: true
          retention-days: 1

  qualityAssurance:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up do Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Baixar ambiente virtual salvo
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: python-env
          path: .venv/

      - name: Restaurar permissões de execução
        run: chmod -R +x .venv/bin/

      - name: Execução do linter (Ruff)
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Execução dos testes
        run: |
          source .venv/bin/activate
          pytest

      - name: Verificação da cobertura
        run: |
          source .venv/bin/activate
          pytest --cov=main --cov-report=term-missing --cov-fail-under=90

  dockerBuild:
    runs-on: ubuntu-latest
    needs: qualityAssurance

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Construir imagem Docker (validação de build)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: .
          push: false
          tags: hortas:test
